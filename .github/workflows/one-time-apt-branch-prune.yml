name: One-time merged branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: prune merged APT integrity branch') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Verify SHA and delete merged audit branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          name = "fix/apt-release-integrity-gates"
          expected = "f561db0ad6ca484f19eba36b01547537d3344f51"
          root = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          path = "/git/ref/heads/" + urllib.parse.quote(name, safe="/")
          with urllib.request.urlopen(urllib.request.Request(root + path, headers=headers), timeout=30) as result:
              found = json.load(result)["object"]["sha"]
          if found != expected:
              raise SystemExit("Branch changed: refuse deletion")
          request = urllib.request.Request(root + "/git/refs/heads/" + urllib.parse.quote(name, safe="/"),
                                           headers=headers, method="DELETE")
          with urllib.request.urlopen(request, timeout=30):
              pass
          print("Deleted fully merged branch:", name)
          PY
