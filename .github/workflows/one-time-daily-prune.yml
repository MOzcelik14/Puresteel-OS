name: One-time daily merged branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: prune merged daily branches') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Archive audited PR heads and prune stale refs
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          expected = {"fix/daily-release-hardening-20260922":"efd7422fe1a238357f9adac77fe76150d40f2d73","fix/ci-debian-keyring-iso-smoke":"a3c802f1f14469c66e760339d27cd21117f56434","fix/trixie-real-iso-packages":"973368d4d76861c2f420b3c7fa84a6b7b5f79c93"}
          temporary = "chore/prune-20260922-merged-fixes"
          root = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}

          def api(method, path, data=None):
              raw = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(root + path, data=raw,
                                           headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  out = response.read()
                  return json.loads(out) if out else None

          if api("GET", "/pulls?state=open&per_page=100"):
              raise SystemExit("Open PR found, no pruning performed")
          for branch, sha in expected.items():
              ref = api("GET", "/git/ref/heads/" + urllib.parse.quote(branch, safe="/"))
              if ref["object"]["sha"] != sha:
                  raise SystemExit("Unreviewed new commits: " + branch)
          api("GET", "/git/ref/heads/" + temporary)

          for branch, sha in expected.items():
              tag = "refs/tags/archive/daily-20260922-" + branch.replace("/", "-")
              api("POST", "/git/refs", {"ref": tag, "sha": sha})
              print("Preserved:", tag)
          for branch in (*expected, temporary):
              api("DELETE", "/git/refs/heads/" + urllib.parse.quote(branch, safe="/"))
              print("Deleted:", branch)
          print("All audited stale branches removed.")
          PY
