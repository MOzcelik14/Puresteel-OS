name: Publish signed Puresteel APT

# Trust only successful validated main pushes or manually dispatched main validation.
# PRs never receive signing secrets.
on:
  workflow_run:
    workflows: ["Puresteel validation"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: puresteel-signed-apt-main
      cancel-in-progress: false
    steps:
      - name: Check out latest main with publish identity
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PURESTEEL_APT_PUBLISH_TOKEN || github.token }}
      - name: Publish only validated head with original archive key
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          SIGNING_KEY: ${{ secrets.PURESTEEL_APT_SIGNING_KEY_B64 }}
          SIGNING_PASSPHRASE: ${{ secrets.PURESTEEL_APT_SIGNING_PASSPHRASE }}
          PUBLISH_TOKEN: ${{ secrets.PURESTEEL_APT_PUBLISH_TOKEN }}
          CHECKS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" || -z "$SIGNING_PASSPHRASE" || -z "$PUBLISH_TOKEN" ]]; then
            echo "::notice title=Signed APT not configured::Add the ORIGINAL key, its passphrase and a scoped Pages publishing token in Actions secrets. Existing signed index is unchanged."
            exit 0
          fi
          if [[ "$(git rev-parse HEAD)" != "$VALIDATED_SHA" ]]; then
            echo "::notice title=Superseded build::main moved since validation. Newer main must be validated before publishing."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg python3
          command -v gh >/dev/null || { echo 'GitHub CLI is missing on publisher runner'; exit 1; }
          umask 077
          export GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/puresteel-apt-gnupg.XXXXXXXX")"
          passfile="$(mktemp "$RUNNER_TEMP/puresteel-apt-pass.XXXXXXXX")"
          trap 'rm -rf "$GNUPGHOME"; rm -f "$passfile"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode | gpg --batch --import
          printf '%s' "$SIGNING_PASSPHRASE" > "$passfile"
          unset SIGNING_KEY SIGNING_PASSPHRASE
          # Keep the imported key home (0700) and passfile (0600) private, but
          # generate public Debian archive files with standard readable modes.
          umask 022
          export PURESTEEL_GPG_PASSPHRASE_FILE="$passfile"
          export PURESTEEL_ROLLING_RELEASE=1
          export PURESTEEL_PACKAGE_VERSION="$(./scripts/rolling-apt-version.sh)"
          ./scripts/release-center.sh
          python3 scripts/verify-apt-repository.py --require-version "$PURESTEEL_PACKAGE_VERSION"
          # Confirm a newer push did not supersede us while packages were built.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]]; then
            echo "::notice title=Superseded before commit::main moved during publishing; leaving it unchanged."
            exit 0
          fi
          git add docs/apt
          if git diff --cached --quiet; then
            echo "Signed APT repository is already up to date."
            exit 0
          fi
          git -c user.name='Puresteel Release Bot' -c user.email='puresteel-release@users.noreply.github.com' \
            commit -m "chore(apt): publish signed rolling $PURESTEEL_PACKAGE_VERSION"
          # A protected main forbids direct pushes: publish through a checked PR.
          # The scoped maintainer token is required to trigger PR CI and Pages.
          export GH_TOKEN="$PUBLISH_TOKEN"
          branch="release/apt-${VALIDATED_SHA:0:12}"
          git push origin "HEAD:refs/heads/$branch"
          pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore(apt): publish signed rolling $PURESTEEL_PACKAGE_VERSION" \
            --body "Automatically generated from validated main commit $VALIDATED_SHA. Original archive key verified; signed Release and package hashes checked.")"
          echo "Signed APT release PR: $pr"
          # Fine-grained PATs cannot request Checks API access. Use the limited
          # Actions token for CI reads; retain maintainer PAT for PR create/merge.
          # GitHub registers PR check runs asynchronously: an immediate
          # gh pr checks exits 1 with "no checks reported" before CI starts.
          # Wait for BOTH required checks on the exact signed release commit,
          # then use gh to require their successful completion. Never skip CI.
          release_sha="$(git rev-parse HEAD)"
          checks_ready=false
          for attempt in $(seq 1 60); do
            required_checks_present="$(GH_TOKEN="$CHECKS_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/commits/$release_sha/check-runs" \
              --jq '[.check_runs[].name] | (index("validate") != null and index("windows-powershell-syntax") != null)')"
            if [[ "$required_checks_present" == "true" ]]; then
              checks_ready=true
              break
            fi
            echo "Waiting for required PR checks to register ($attempt/60)"
            sleep 10
          done
          if [[ "$checks_ready" != "true" ]]; then
            echo "::error title=PR checks timed out::Required checks did not appear for $release_sha; leaving PR unmerged."
            exit 1
          fi
          # PR checks verify this exact newly signed archive. No bypass is used.
          GH_TOKEN="$CHECKS_TOKEN" gh pr checks "$pr" --watch --fail-fast --repo "$GITHUB_REPOSITORY"
          # Never merge a release produced from an obsolete source commit.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]]; then
            echo "::notice title=Outdated signed APT PR::main changed during release verification. Leaving PR unmerged for review."
            exit 0
          fi
          gh pr merge "$pr" --merge --match-head-commit "$(git rev-parse HEAD)" \
            --delete-branch --repo "$GITHUB_REPOSITORY"
          echo "Signed packages published via checked PR: $PURESTEEL_PACKAGE_VERSION"
