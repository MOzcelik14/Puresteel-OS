name: Puresteel validation

on:
  pull_request:
  push:
    branches: [ main ]
    # Signed-index-only publisher commits must not rebuild the ISO or republish APT.
    paths-ignore:
      - 'docs/apt/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3 python3-yaml dpkg-dev gnupg
      - name: Shell syntax
        run: |
          find scripts config -type f \( -name '*.sh' -o -name '*.hook.chroot' \) -print0 | xargs -0 -r shellcheck -S error
          shellcheck -S error build.sh bootstrap.sh config/includes.chroot/usr/bin/puresteel-installer
      - name: Documentation renderer syntax
        run: node --check docs/assets/guide.js
      - name: Python syntax
        run: |
          python3 -m compileall -q config/includes.chroot/usr/local/bin config/includes.chroot/usr/local/sbin packages/puresteel-center/rootfs/usr/share/puresteel-center packages/puresteel-center/rootfs/usr/lib/puresteel-center
      - name: Calamares YAML
        run: |
          python3 - <<'PY'
          import yaml
          for path in [
              "config/includes.chroot/etc/calamares/settings.conf",
              "config/includes.chroot/etc/calamares/modules/users.conf",
          ]:
              with open(path, encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print("OK", path)
          PY
      - name: Build Puresteel Center package
        run: ./scripts/build-center-package.sh
      - name: Build metapackages
        run: ./scripts/build-meta-packages.sh
      - name: Build component packages
        run: ./scripts/build-component-packages.sh
      - name: Test package payloads
        run: |
          for deb in build/packages/puresteel-{platform,recovery,branding,default-settings}_*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" > /tmp/puresteel-package-contents
            grep -q -E 'usr/local/bin/puresteel|usr/local/sbin/puresteel|usr/share/icons/Puresteel|etc/xdg/kdeglobals|etc/sddm.conf.d' /tmp/puresteel-package-contents
          done
      - name: Platform safety unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify published APT signature and package integrity
        run: python3 scripts/verify-apt-repository.py
      - name: Report signed APT repository freshness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("packages/puresteel-center/VERSION").read_text().strip()
          packages = Path("docs/apt/dists/stable/main/binary-amd64/Packages").read_text()
          published = ""
          in_center = False
          for line in packages.splitlines():
              if line == "Package: puresteel-center":
                  in_center = True
              elif in_center and line.startswith("Version: "):
                  published = line.split(": ", 1)[1].strip()
                  break
              elif in_center and not line.strip():
                  break
          if not published:
              raise SystemExit("Puresteel APT index has no puresteel-center version")
          if source != published:
              print(f"::warning title=Puresteel APT repository is behind source::source={source}, published={published}. Publish only with the existing private signing key.")
          else:
              print(f"Puresteel APT repository matches source version {source}")
          PY

  windows-powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows ISO builder as PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./windows-build.ps1).Path,
              [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
          }
          Write-Host 'Windows ISO builder syntax OK'

  iso-smoke:
    # Single rolling release line: build every merged main and recheck nightly.
    needs: [validate, windows-powershell-syntax]
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[iso-smoke]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: puresteel-rolling-iso-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: sudo apt-get update && sudo apt-get install -y debian-archive-keyring debootstrap squashfs-tools xorriso isolinux syslinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools rsync dpkg-dev apt-utils gnupg po4a ca-certificates wget git make python3 && git clone --depth=1 https://salsa.debian.org/live-team/live-build.git /tmp/puresteel-live-build && sudo make -C /tmp/puresteel-live-build install
      - name: Free unused runner toolchains for full ISO
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h .
      - name: Build ISO
        run: sudo ./build.sh
      - name: Validate generated ISO filesystem and package database
        run: |
          shopt -s nullglob
          isos=(./*.iso)
          test "${#isos[@]}" -eq 1
          ./scripts/smoke-iso.sh "${isos[0]}"
          ./scripts/release-artifacts.sh "${isos[0]}"
          test -s "${isos[0]}.sha256"
          test -s "${isos[0]%.iso}-packages.txt"
      - name: Checksums
        run: sha256sum *.iso | tee puresteel-ci.sha256
      - name: Upload ISO build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: puresteel-iso-build-logs
          path: build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: puresteel-iso
          retention-days: 7
          compression-level: 0
          path: |
            *.iso
            *.iso.sha256
            *-packages.txt
            *-provenance.json
            puresteel-ci.sha256
      - name: Publish latest passing ISO to Cloudflare R2 (if configured)
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID$R2_ACCESS_KEY_ID$R2_SECRET_ACCESS_KEY$R2_BUCKET" ]]; then
            echo "::notice title=R2 not configured::Rolling ISO is available in GitHub Actions; add R2 secrets for public distribution."
            exit 0
          fi
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_BUCKET" ]]; then
            echo "::error title=Incomplete R2 configuration::Set all four R2 secrets or none."
            exit 1
          fi
          # Ubuntu's GitHub-hosted runner may not offer an apt awscli candidate.
          # Install the official AWS CLI v2 into the runner's temporary directory.
          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y unzip
          fi
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/awscliv2.zip" \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP/aws-cli-installer"
          "$RUNNER_TEMP/aws-cli-installer/aws/install" \
            --install-dir "$RUNNER_TEMP/aws-cli" \
            --bin-dir "$RUNNER_TEMP/aws-bin"
          export PATH="$RUNNER_TEMP/aws-bin:$PATH"
          aws --version
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          iso="live-image-amd64.hybrid.iso"
          test -s "$iso" && test -s "$iso.sha256"
          # A failed build never removes the previous working public ISO.
          aws --endpoint-url "$endpoint" s3 cp "$iso" \
            "s3://${R2_BUCKET}/Puresteel-Latest.iso" --no-progress \
            --content-type application/x-iso9660-image
          sha256sum "$iso" | sed "s|  $iso$|  Puresteel-Latest.iso|" \
            > Puresteel-Latest.iso.sha256
          aws --endpoint-url "$endpoint" s3 cp Puresteel-Latest.iso.sha256 \
            "s3://${R2_BUCKET}/Puresteel-Latest.iso.sha256" --no-progress \
            --content-type text/plain
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          Path("Puresteel-Latest.json").write_text(json.dumps({
              "channel": "rolling",
              "commit": os.environ["GITHUB_SHA"],
              "generated_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "iso": "Puresteel-Latest.iso",
              "bytes": Path("live-image-amd64.hybrid.iso").stat().st_size,
              "sha256": Path("Puresteel-Latest.iso.sha256").read_text(encoding="utf-8").split()[0],
              "checksum": "Puresteel-Latest.iso.sha256",
              "validation": "static-ISO-smoke",
          }, indent=2) + "\n", encoding="utf-8")
          PY
          # Publish manifest last so clients can identify the uploaded build.
          aws --endpoint-url "$endpoint" s3 cp Puresteel-Latest.json \
            "s3://${R2_BUCKET}/Puresteel-Latest.json" --no-progress \
            --content-type application/json
          echo "Published rolling ISO for ${GITHUB_SHA}."

