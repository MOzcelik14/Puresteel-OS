---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth

# KWallet is unlocked by PAM with the login password. Autologin is intentionally
# hidden because no login password would be available to unlock an encrypted wallet.
autologinGroup:  autologin
displayAutologin: false
doAutologin: false

sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    minLength: 6

user:
    shell: /usr/bin/fish
