---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

# Puresteel keeps password validation intentionally simple:
# any password with at least 6 characters is accepted.
passwordRequirements:
    minLength: 6

user:
    shell: /usr/bin/fish
